# Publishes the package to PyPI when a version tag (v0.1.0, v1.2.3, v1.2.3rc1) is pushed.
#
# Release with:
#   1. Bump `version` in pyproject.toml and add the changes to CHANGELOG.md.
#   2. Commit and merge to main.
#   3. git tag v<version> && git push origin v<version>
#
# Auth is PyPI Trusted Publishing (OIDC), so no token is stored in GitHub. Set it up once on
# pypi.org (see PUBLISHING.md): account > Publishing > add a pending publisher with
#   PyPI project name: llama-index-readers-printfriendly
#   Owner:             printfriendly
#   Repository:        llama-index-readers-printfriendly
#   Workflow filename: publish.yml
#   Environment name:  pypi
#
# Nothing in this file runs until a tag is pushed.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Check the tag matches pyproject.toml
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version." >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          make lint
          make test

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the one entered in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/llama-index-readers-printfriendly/
    permissions:
      # Lets the job request the OIDC token that PyPI trusted publishing uses.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
